<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; background: transparent; overflow: hidden; }
  #stage { position: absolute; inset: 0; }
  .block { position: absolute; left: 0; top: 0; display: none; }
  .ch { position: absolute; left: 0; top: 0; white-space: pre; line-height: normal; }
  .probe { display: inline-block; width: 0; height: 0; vertical-align: baseline; }
  .mline { position: absolute; left: 0; top: 0; white-space: pre; line-height: normal; }
  #measure { position: absolute; left: 0; top: 0; visibility: hidden; }
  .debug { position: absolute; border: 2px dashed rgba(0,255,0,.8); box-sizing: border-box; pointer-events: none; }
  .lgrp { position: absolute; left: 0; top: 0; }
  .capsule { position: absolute; }
  .cbox { position: absolute; left: 0; white-space: pre; line-height: normal; }
  .cin { display: inline-block; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="measure"></div>
<script>
// ---------------------------------------------------------------------------
// Deterministic subtitle renderer. Python calls init(timeline) once, then seek(t)
// per frame and screenshots the transparent page. The fonts come from the timeline
// (style.fonts: {alias: [{url, weight, style, features}]}, resolved from the brand).
// Letters are laid out in a normal text run (so kerning + tracking are exact), then each
// glyph is cloned into an absolutely positioned span at its measured pen position so it can
// be animated individually without changing the typography.
// seek(t, layer): 'back' draws all but the behind:false blocks, 'front' only those (the
// front layer, composited over her without the matte); no layer draws everything.
// Graphic templates (blk.template): 'cta-lockup' and 'count-up', ported from HyperFrames
// (Apache-2.0, see NOTICE) onto this file's own deterministic easing; no GSAP, no network.
// ---------------------------------------------------------------------------
let TL = null;
let BLOCKS = [];      // {el, screen, chars:[{el, start, anim, baseline}], bbox}
window.ready = Promise.resolve();

function styleFor(kind, S, tok) {
  const st = styleForKind(kind, S);
  if (tok && tok.scale) st.size *= tok.scale;
  if (tok && tok.color && st.color !== S.main.color) st.color = tok.color;   // per-line accent colour
  return st;
}

function styleForKind(kind, S) {
  const m = S.main;
  const base = { family: m.family, weight: m.weight, italic: false, color: m.color, size: m.size, tracking: m.tracking };
  if (kind === 'accent') return { ...base, family: S.accent.family, weight: S.accent.weight, italic: true,
                                  color: S.accent.color, size: m.size * S.accent.scale, tracking: S.accent.tracking,
                                  outline: S.accent.outline };
  if (kind === 'accent-white') return { ...base, family: S.accent.family, weight: S.accent.weight, italic: true,
                                  size: m.size * S.accent.scale, tracking: S.accent.tracking };
  if (kind === 'deco') return { ...base, color: S.accent.color, outline: S.accent.outline };
  if (kind === 'label') return { ...base, family: S.label.family, weight: S.label.weight, color: S.label.color,
                                 size: m.size * S.label.scale, tracking: S.label.tracking };
  return base;
}

function faces(family) {
  return (TL.style.fonts || {})[family] || [];
}

function applyFont(el, st) {
  el.style.fontFamily = `'${st.family}'`;
  el.style.fontFeatureSettings = (faces(st.family)[0] || {}).features || 'normal';
  el.style.textShadow = st.outline || 'none';
  el.style.fontWeight = st.weight;
  el.style.fontStyle = st.italic ? 'italic' : 'normal';
  el.style.fontSize = st.size + 'px';
  el.style.letterSpacing = (st.tracking || 0) + 'em';
  el.style.color = st.color;
}

function baselineOf(el) {
  const p = document.createElement('span');
  p.className = 'probe';
  el.appendChild(p);
  const r = p.getBoundingClientRect(), e = el.getBoundingClientRect();
  el.removeChild(p);
  return r.bottom - e.top;
}

// Build the visual line in the hidden measure layer; returns per-char pen positions.
function layoutLine(line, S) {
  const div = document.createElement('div');
  div.className = 'mline';
  document.getElementById('measure').appendChild(div);
  const spans = [];
  line.tokens.forEach((tok, i) => {
    if (i > 0 && !tok.glue) {
      const sp = document.createElement('span');
      applyFont(sp, styleFor(line.tokens[i - 1].kind === 'accent' && tok.kind === 'accent' ? 'accent' : 'main', S));
      sp.textContent = ' ';
      sp.style.wordSpacing = (S.word_space || 0) + 'em';
      sp.dataset.space = '1';
      div.appendChild(sp);
      spans.push({ el: sp, tok: null });
    }
    const s = document.createElement('span');
    applyFont(s, styleFor(tok.kind, S, tok));
    s.textContent = tok.text;
    div.appendChild(s);
    spans.push({ el: s, tok });
  });
  const base = baselineOf(div);
  const d0 = div.getBoundingClientRect();
  const chars = [];
  for (const { el, tok } of spans) {
    if (!tok) continue;
    const node = el.firstChild;
    const st = styleFor(tok.kind, S, tok);
    // iterate by code points
    let idx = 0;
    for (const c of tok.text) {
      const r = document.createRange();
      r.setStart(node, idx); r.setEnd(node, idx + c.length);
      const rect = r.getBoundingClientRect();
      chars.push({ c, x: rect.left - d0.left, w: rect.width, tok, st });
      idx += c.length;
    }
  }
  const width = d0.width;
  div.remove();
  return { chars, width, base };
}

async function init(timeline) {
  TL = timeline;
  if (!TL.style.fonts) throw new Error('timeline.json predates brand fonts: rerun build_timeline');
  for (const [alias, list] of Object.entries(TL.style.fonts)) {
    for (const f of list) {
      const face = new FontFace(alias, `url("${f.url}")`, { weight: f.weight || 'normal', style: f.style || 'normal' });
      try { await face.load(); } catch (e) { throw new Error(`font ${alias} failed: ${f.url}`); }
      document.fonts.add(face);
    }
  }
  await document.fonts.ready;
  const S = TL.style;
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  BLOCKS = [];
  TL.screens.forEach((screen, si) => {
    screen.blocks.forEach((blk) => {
      const el = document.createElement('div');
      el.className = 'block';
      el.style.filter = blockFilter(blk, S);
      el.style.display = 'block';          // must be rendered while glyph baselines are measured
      stage.appendChild(el);
      if (blk.template === 'count-up') { BLOCKS.push(initCount(el, blk, screen, S)); return; }
      const LH = S.main.size * (blk.leading || S.leading);
      const lines = blk.lines.map(l => layoutLine(l, S));
      const bw = Math.max(...lines.map((l, i) => l.width + (blk.lines[i].indent || 0) * S.main.size));
      const chars = [];
      let minTop = 1e9, maxBot = -1e9, minX = 1e9, maxX = -1e9, extra = 0;
      const lock = blk.template === 'cta-lockup' ? lockupSpec(blk, S) : null;
      lines.forEach((ln, li) => {
        const spec = blk.lines[li];
        const indentPx = (spec.indent || 0) * S.main.size;
        const lineAlign = spec.align || blk.align || 'left';
        let x0 = lineAlign === 'right' ? bw - ln.width - indentPx
               : lineAlign === 'center' ? (bw - ln.width) / 2 + indentPx : indentPx;
        if (lineAlign === 'left' && ln.chars.length && '([«'.includes(ln.chars[0].c)) x0 -= ln.chars[0].w * 0.85;
        // a scaled line pushes itself (and everything below it) down by its extra cap height
        const lineScale = Math.max(1, ...spec.tokens.map(t => t.scale || 1));
        extra += (lineScale - 1) * S.main.size * 0.74;
        // serif accents / labels have taller ascenders, brackets and descenders than the grotesk:
        // give those lines (and the line after them) just enough room so pink never sits on white
        const tall = tk => tk.kind === 'accent' || tk.kind === 'accent-white' || tk.kind === 'label';
        if (li > 0 && spec.tokens.some(tall)) extra += S.main.size * (S.accent_gap ?? 0.16);
        if (li > 0 && blk.lines[li - 1].tokens.some(tall)) extra += S.main.size * (S.accent_gap_after ?? 0.1);
        let parent = el;
        if (lock) {                        // lockup: one group per line, the capsule line padded
          parent = document.createElement('div');
          parent.className = 'lgrp';
          el.appendChild(parent);
          lock.groups.push(parent);
          if (li === lock.btn && li > 0) extra += lock.padY + lock.gap;
          if (li === lock.btn + 1) extra += lock.padY + lock.gap * 0.5;
        }
        const baselineY = (spec.dy || 0) * S.main.size + li * LH + extra + (blk.first_baseline || S.main.size * 0.8);
        const inBtn = lock && li === lock.btn;
        for (const ch of ln.chars) {
          if (ch.c === ' ') continue;
          const s = document.createElement('span');
          s.className = 'ch';
          const st = inBtn ? { ...ch.st, color: lock.ink, outline: 'none' } : ch.st;
          applyFont(s, st);
          s.textContent = ch.c;
          parent.appendChild(s);
          const b = baselineOf(s);
          const left = x0 + ch.x, top = baselineY - b;
          s.style.left = left + 'px';
          s.style.top = top + 'px';
          s.style.transformOrigin = `0px ${b}px`;
          minTop = Math.min(minTop, baselineY - ch.st.size * 0.74);
          maxBot = Math.max(maxBot, baselineY + ch.st.size * 0.22);
          minX = Math.min(minX, left); maxX = Math.max(maxX, left + ch.w);
          chars.push({ el: s, tok: ch.tok, start: 0, kind: ch.tok.kind, left, top, w: ch.w, baselineY, size: ch.st.size,
                       anim: lock ? 'none' : ch.tok.anim || (ch.tok.kind === 'label' ? 'pop' : S.anim.kind),
                       st, li, fill: !!inBtn });
        }
        if (inBtn && ln.chars.length) {    // the capsule behind the line, in the brand accent
          const size = Math.max(...ln.chars.map(c => c.st.size));
          const r = { x: x0 - lock.padX, y: baselineY - size * 0.74 - lock.padY, w: ln.width + 2 * lock.padX,
                      h: size * 0.96 + 2 * lock.padY };
          const cap = document.createElement('div');
          cap.className = 'capsule';
          Object.assign(cap.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px',
                                     borderRadius: r.h / 2 + 'px', background: lock.fill });
          parent.insertBefore(cap, parent.firstChild);
          lock.cap = { ...r, cx: r.x + r.w / 2, cy: r.y + r.h / 2 };
          minTop = Math.min(minTop, r.y); maxBot = Math.max(maxBot, r.y + r.h);
          minX = Math.min(minX, r.x); maxX = Math.max(maxX, r.x + r.w);
        }
      });
      // pop animations scale whole words around the word centre
      const byTok = new Map();
      for (const ch of chars) { if (!byTok.has(ch.tok)) byTok.set(ch.tok, []); byTok.get(ch.tok).push(ch); }
      for (const [tok, cs] of byTok) {
        if (cs[0].anim !== 'pop') continue;
        const cx = (Math.min(...cs.map(c => c.left)) + Math.max(...cs.map(c => c.left + c.w))) / 2;
        const cy = cs[0].baselineY - cs[0].size * 0.33;
        for (const c of cs) c.el.style.transformOrigin = `${cx - c.left}px ${cy - c.top}px`;
      }
      // reveal schedule: sequential typing inside the block, never before the token's own time
      let prev = -1e9;
      const cps = blk.cps || S.anim.cps;
      for (const ch of chars) {
        const t = ch.tok.t;
        if (ch.anim === 'pop' || ch.anim === 'none') { ch.start = t; continue; }
        ch.start = Math.max(t, prev + 1 / cps);
        prev = ch.start;
      }
      const bx = blk.x || 0, by = blk.y || 0;
      el.style.left = bx + 'px';
      el.style.top = by + 'px';
      el.style.display = 'none';
      if (lock) {                          // groups scale and drift around their own centres
        lock.groups.forEach((g, li) => {
          const cs = chars.filter(c => c.li === li);
          const cx = li === lock.btn && lock.cap ? lock.cap.cx : cs.length ? (Math.min(...cs.map(c => c.left)) +
                     Math.max(...cs.map(c => c.left + c.w))) / 2 : 0;
          const cy = li === lock.btn && lock.cap ? lock.cap.cy : cs.length ? cs[0].baselineY - cs[0].size * 0.33 : 0;
          g.style.transformOrigin = `${cx}px ${cy}px`;
        });
      }
      BLOCKS.push({ el, screen, blk, chars, lock, bbox: { x: bx + minX, y: by + minTop, w: maxX - minX, h: maxBot - minTop } });
    });
  });
  initDoodles(TL.doodles || [], S);
  return true;
}

// ----------------------------------------------------------------------------- block outline (stroke)
const SVGNS_FX = 'http://www.w3.org/2000/svg';

function strokeFilter(sk) {                // a real outline: alpha dilated by px, flooded, under the glyphs
  const px = Math.min(4, sk.px || 3), color = sk.color || '#171717';
  const id = `stk${px}_${color.replace(/[^0-9a-z]/gi, '')}`;
  if (!document.getElementById(id)) {
    let defs = document.getElementById('fxdefs');
    if (!defs) {
      defs = document.createElementNS(SVGNS_FX, 'svg');
      defs.id = 'fxdefs';
      Object.assign(defs.style, { position: 'absolute', width: 0, height: 0 });
      document.body.appendChild(defs);
    }
    const f = document.createElementNS(SVGNS_FX, 'filter');
    f.id = id;
    for (const [k, v] of Object.entries({ filterUnits: 'userSpaceOnUse', x: -2200, y: -2200, width: 4400, height: 4400,
                                          'color-interpolation-filters': 'sRGB' })) f.setAttribute(k, v);
    f.innerHTML = `<feMorphology in="SourceAlpha" operator="dilate" radius="${px}" result="d"/>` +
                  `<feFlood flood-color="${color}" result="c"/><feComposite in="c" in2="d" operator="in" result="o"/>` +
                  `<feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>`;
    defs.appendChild(f);
  }
  return `url(#${id})`;
}

function blockFilter(blk, S) {
  return blk.stroke ? strokeFilter(blk.stroke) + ' ' + S.shadow : S.shadow;
}

// ----------------------------------------------------------------------------- easing (GSAP's curves, closed form)
const EASE = {
  linear: p => p,
  power2out: p => 1 - Math.pow(1 - p, 3),
  power3out: p => 1 - Math.pow(1 - p, 4),
  sineInOut: p => -(Math.cos(Math.PI * p) - 1) / 2,
  backOut: (p, s = 1.7) => 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2),
};

// value of a tween from v0 to v1 that starts at `at` and lasts `dur`, at local time u
function tween(u, at, dur, v0, v1, ease) {
  const p = dur > 0 ? Math.min(1, Math.max(0, (u - at) / dur)) : (u >= at ? 1 : 0);
  return v0 + (v1 - v0) * ease(p);
}

// a yoyo drift: 0 -> d -> 0 over `dur` from `at` (sine in-out each way)
function drift(u, at, dur, d) {
  if (dur <= 0 || u <= at) return 0;
  const q = Math.min(2, (u - at) / (dur / 2));
  return d * EASE.sineInOut(q <= 1 ? q : 2 - q);
}

function relLum(color) {                   // WCAG relative luminance of #rgb / #rrggbb
  let h = (color || '').replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  if (!/^[0-9a-f]{6}$/i.test(h)) return 1;
  const ch = [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16) / 255)
    .map(c => c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
  return 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
}

function contrast(a, b) {
  const la = relLum(a), lb = relLum(b);
  return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
}

// ----------------------------------------------------------------------------- template: cta-lockup
// After HyperFrames' cta-lockup (Apache-2.0, see NOTICE): the action line rises in, the capsule (the code word, in the
// brand accent) pops under it with a restrained overshoot, the microcopy settles last, then the
// lockup holds with one barely visible drift. IN is 1.6 s, compressed when the card is shorter.
// The capsule is line "button": true, else the second line (the only line of a one-line card).
function lockupSpec(blk, S) {
  const n = blk.lines.length;
  let btn = blk.lines.findIndex(l => l.button);
  if (btn < 0) btn = Math.min(1, n - 1);
  const fill = blk.lines[btn].color || S.accent.color;
  const ink = contrast(S.main.color, fill) >= contrast('#171717', fill) ? S.main.color : '#171717';
  const size = S.main.size * Math.max(1, ...blk.lines[btn].tokens.map(t => t.scale || 1));
  return { btn, fill, ink, padX: size * 0.55, padY: size * 0.3, gap: S.main.size * 0.18, groups: [], cap: null };
}

function seekLockup(B, t, t0, t1) {
  const L = B.lock, size = TL.style.main.size;
  const e = Math.min(1, Math.max(0.001, (t1 - t0) / 1.6)), IN = 1.6 * e, u = t - t0;
  const hold = drift(u, IN, Math.max(0, t1 - t0 - IN), -0.07 * size);
  L.groups.forEach((g, li) => {
    let o = 1, y = 0, s = 1;
    if (li < L.btn) {
      o = tween(u, 0, 0.5 * e, 0, 1, EASE.power3out);
      y = tween(u, 0, 0.5 * e, 0.45 * size, 0, EASE.power3out);
    } else if (li === L.btn) {
      o = tween(u, 0.56 * e, 0.24 * e, 0, 1, EASE.power2out);
      s = tween(u, 0.56 * e, 0.6 * e, 0.72, 1, EASE.backOut);
      y = tween(u, 0.56 * e, 0.6 * e, 0.3 * size, 0, EASE.backOut);
    } else {
      o = tween(u, 1.18 * e, 0.42 * e, 0, 1, EASE.power2out);
      y = tween(u, 1.18 * e, 0.42 * e, 0.25 * size, 0, EASE.power2out);
    }
    g.style.opacity = o;
    g.style.transform = `translate(0px, ${y + hold}px) scale(${s})`;
  });
}


// ----------------------------------------------------------------------------- template: count-up
// After HyperFrames' count-up (Apache-2.0, see NOTICE): the number arrives (fade, rise, 0.98 -> 1), counts from
// blk.count_from (default 0) to the line's number on a sine in-out curve stepped per frame,
// lands with one scale pulse at 1.72 s, then holds with a slight drift. Text around the number
// ("-", "%", "продуктів") is the affix: 0.55 em in the number's colour mixed 72/28 with the
// main colour; a lone currency or math sign is lifted to the figures' optical centre (vertical-align: a
// position: relative span under the pulsing scale paints differently after other frames, so seek would
// depend on the frames rendered before). Digit groups ("10 000") count with a no-break space; decimals keep
// the typed separator.
const COUNT_RE = /^(\D*?)(\d{1,3}(?:\u00a0\d{3})+|\d+(?:[.,]\d+)?)(.*)$/;

function affixLift(text) {
  if (/^[$€£¥₹₩₴]$/.test(text)) return '0.31em';
  if (/^[+−±×=~<>-]+$/.test(text)) return '0.36em';
  return '';
}

function initCount(el, blk, screen, S) {
  const spec = blk.lines[0], toks = spec.tokens;
  const k = Math.max(0, toks.findIndex(t => /\d/.test(t.text)));
  const m = toks[k].text.match(COUNT_RE) || ['', '', '0', toks[k].text];
  const typed = m[2], grouped = typed.includes('\u00a0');
  const dec = (typed.split(/[.,]/)[1] || '').length, sep = typed.includes(',') ? ',' : '.';
  const end = parseFloat(typed.replace(/\u00a0/g, '').replace(',', '.')), start = blk.count_from ?? 0;
  const fmt = v => {
    let [i, f] = Math.abs(v).toFixed(dec).split('.');
    if (grouped) i = i.replace(/\B(?=(\d{3})+(?!\d))/g, '\u00a0');
    return (v < 0 ? '−' : '') + i + (f ? sep + f : '');
  };
  const st = styleFor(toks[k].kind, S, toks[k]);
  const align = spec.align || blk.align || 'left';
  const box = document.createElement('div');
  box.className = 'cbox';
  box.style.textAlign = align;
  const inner = document.createElement('span');
  inner.className = 'cin';
  box.appendChild(inner);
  el.appendChild(box);
  const affix = (text, tst) => {
    const s = document.createElement('span');
    applyFont(s, tst);
    s.style.fontSize = tst.size * 0.55 + 'px';
    s.style.color = `color-mix(in srgb, ${tst.color} 72%, ${S.main.color})`;
    const lift = affixLift(text.trim());
    if (lift) s.style.verticalAlign = lift;
    s.textContent = text;
    inner.appendChild(s);
  };
  let value = null;
  toks.forEach((tok, i) => {
    const tst = styleFor(tok.kind, S, tok);
    if (i > 0 && !tok.glue) affix(' ', tst);
    if (i !== k) { affix(tok.text, tst); return; }
    if (m[1]) affix(m[1], tst);
    value = document.createElement('span');
    applyFont(value, st);
    value.style.fontVariantNumeric = 'tabular-nums';
    value.style.fontFeatureSettings = '"tnum" 1';
    inner.appendChild(value);
    if (m[3]) affix(m[3], tst);
  });
  const widths = [start, end].map(v => { value.textContent = fmt(v); return inner.getBoundingClientRect().width; });
  const bw = Math.max(...widths);
  box.style.width = bw + 'px';
  const lineScale = Math.max(1, ...toks.map(t => t.scale || 1));
  const baselineY = (spec.dy || 0) * S.main.size + (lineScale - 1) * S.main.size * 0.74 +
                    (blk.first_baseline || S.main.size * 0.8);
  box.style.top = baselineY - baselineOf(box) + 'px';
  inner.style.transformOrigin = '50% 58%';
  const bx = blk.x || 0, by = blk.y || 0;
  el.style.left = bx + 'px';
  el.style.top = by + 'px';
  el.style.display = 'none';
  const bbox = { x: bx, y: by + baselineY - st.size * 0.74, w: bw, h: st.size * 0.96 };
  const word = { x: bbox.x - bx, y: bbox.y - by, w: bbox.w, h: bbox.h, t: toks[k].t, color: st.color,
                 text: toks.map(t => t.text).join(' ') };
  return { el, screen, blk, chars: [], bbox, count: { inner, value, fmt, start, end, size: st.size, word } };
}

function seekCount(B, t, t0, t1) {
  const C = B.count, D = Math.max(0.001, t1 - t0), u = t - t0;
  const k = D < 2.05 ? D / 2.05 : 1;
  const COUNT = 1.72 * k, PH = 0.165 * k, ARR = 0.38 * k, IN = 2.05 * k;
  const last = Math.max(1, Math.round(COUNT * 30));
  const row = Math.min(last, Math.max(0, Math.floor(u / COUNT * last + 1e-6)));
  C.value.textContent = C.fmt(C.start + (C.end - C.start) * EASE.sineInOut(row / last));
  const o = tween(u, 0, ARR, 0, 1, EASE.power2out);
  const y = tween(u, 0, ARR, 0.12 * C.size, 0, EASE.power3out) + drift(u, IN, Math.max(0, D - IN - 0.25), -0.03 * C.size);
  let s = tween(u, 0, ARR, 0.98, 1, EASE.power3out);
  if (u >= COUNT) s = u < COUNT + PH ? tween(u, COUNT, PH, 1, 1.07, EASE.power3out)
                                     : tween(u, COUNT + PH, PH, 1.07, 1, EASE.power2out);
  C.inner.style.opacity = o;
  C.inner.style.transform = `translate(0px, ${y}px) scale(${s})`;
}

// ----------------------------------------------------------------------------- doodles (hand-drawn SVG)
let DOODLES = [];
const SVGNS = 'http://www.w3.org/2000/svg';

function polyD(pts) {
  return 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L');
}

function doodlePaths(d) {
  const P = [];
  if (d.type === 'circle') {               // loose hand-drawn ellipse, ~1.15 turns
    const cx = d.x + d.w / 2, cy = d.y + d.h / 2, rx = d.w / 2, ry = d.h / 2, a0 = (d.a0 ?? -2.2);
    const pts = [];
    for (let i = 0; i <= 90; i++) {
      const a = a0 + (i / 90) * Math.PI * 2 * 1.15;
      const r = 1 + 0.05 * Math.sin(3 * a + 0.7) + 0.06 * (i / 90);
      pts.push([cx + rx * r * Math.cos(a), cy + ry * r * Math.sin(a)]);
    }
    P.push({ d: polyD(pts), share: 1 });
  } else if (d.type === 'arrow') {          // curved arrow from (x,y) to (x+w, y+h)
    const x1 = d.x, y1 = d.y, x2 = d.x + d.w, y2 = d.y + d.h;
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, bend = (d.bend ?? 0.3);
    const qx = mx - d.h * bend, qy = my + d.w * bend;
    P.push({ d: `M${x1} ${y1} Q${qx} ${qy} ${x2} ${y2}`, share: 0.72 });
    const ang = Math.atan2(y2 - qy, x2 - qx), hl = (d.head ?? 26);
    const h1 = [x2 - hl * Math.cos(ang - 0.5), y2 - hl * Math.sin(ang - 0.5)];
    const h2 = [x2 - hl * Math.cos(ang + 0.5), y2 - hl * Math.sin(ang + 0.5)];
    P.push({ d: polyD([h1, [x2, y2], h2]), share: 0.28 });
  } else if (d.type === 'underline') {      // wavy underline
    const pts = [];
    for (let i = 0; i <= 40; i++) pts.push([d.x + d.w * i / 40, d.y + (d.amp ?? 6) * Math.sin(i / 40 * Math.PI * (d.waves ?? 3) * 2)]);
    P.push({ d: polyD(pts), share: 1 });
  }
  return P;
}

function starD(r) {                          // 4-point sparkle centred at 0,0
  const k = 0.22, pts = [];
  for (let i = 0; i < 8; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 4, rr = i % 2 ? r * k : r;
    pts.push([rr * Math.cos(a), rr * Math.sin(a)]);
  }
  return polyD(pts) + 'Z';
}

function initDoodles(list, S) {
  let svg = document.getElementById('doodles');
  if (!svg) {
    svg = document.createElementNS(SVGNS, 'svg');
    svg.id = 'doodles';
    svg.setAttribute('width', 1080); svg.setAttribute('height', 1920);
    Object.assign(svg.style, { position: 'absolute', left: 0, top: 0, filter: S.shadow, overflow: 'visible' });
    document.body.appendChild(svg);
  }
  svg.innerHTML = '';
  DOODLES = list.map(d => {
    const g = document.createElementNS(SVGNS, 'g');
    svg.appendChild(g);
    const color = d.color || S.accent.color, sw = d.stroke || 5;
    const parts = [];
    if (d.type === 'sparkle') {
      for (const [ox, oy, sc] of (d.stars || [[0, 0, 1]])) {
        const p = document.createElementNS(SVGNS, 'path');
        p.setAttribute('d', starD((d.size || 26) * sc));
        p.setAttribute('fill', color);
        const wrap = document.createElementNS(SVGNS, 'g');
        wrap.appendChild(p);
        g.appendChild(wrap);
        parts.push({ el: wrap, ox: d.x + ox, oy: d.y + oy });
      }
    } else {
      for (const pp of doodlePaths(d)) {
        const p = document.createElementNS(SVGNS, 'path');
        p.setAttribute('d', pp.d);
        const attrs = { fill: 'none', stroke: color, 'stroke-width': sw, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' };
        for (const k in attrs) p.setAttribute(k, attrs[k]);
        g.appendChild(p);
        const len = p.getTotalLength();
        p.setAttribute('stroke-dasharray', len);
        parts.push({ el: p, len, share: pp.share });
      }
    }
    return { d, g, parts };
  });
}

function seekDoodles(t) {
  for (const D of DOODLES) {
    const d = D.d, t1 = (d.t1 ?? 1e9);
    const on = t >= d.t && t < t1;
    D.g.style.display = on ? 'inline' : 'none';
    if (!on) continue;
    D.g.style.opacity = d.fade ? Math.min(1, Math.max(0, (t1 - t) / d.fade)) : 1;
    const p = Math.min(1, (t - d.t) / (d.dur || 0.3));
    if (d.type === 'sparkle') {
      D.parts.forEach((pt, i) => {
        const pi = Math.min(1, Math.max(0, (t - d.t - i * 0.07) / (d.dur || 0.25)));
        const s = kf([[0, 0], [0.55, 1.25], [1, 1]], pi) * (1 + 0.12 * Math.sin((t - d.t) * 14 + i * 2));
        const rot = (1 - pi) * -60 + (t - d.t) * 25;
        pt.el.setAttribute('transform', `translate(${pt.ox} ${pt.oy}) rotate(${rot}) scale(${s})`);
      });
    } else {
      let acc = 0;
      for (const pt of D.parts) {
        const q = Math.min(1, Math.max(0, (p - acc) / pt.share));
        const e = 1 - Math.pow(1 - q, 2);
        pt.el.setAttribute('stroke-dashoffset', pt.len * (1 - e));
        acc += pt.share;
      }
    }
  }
}

// keyframe interpolation (smoothstep between keys)
function kf(keys, p) {
  if (p <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    if (p <= keys[i][0]) {
      const [p0, v0] = keys[i - 1], [p1, v1] = keys[i];
      let u = (p - p0) / (p1 - p0);
      u = u * u * (3 - 2 * u);
      return v0 + (v1 - v0) * u;
    }
  }
  return keys[keys.length - 1][1];
}

function charTransform(ch, dt, A) {
  if (ch.anim === 'none') return { o: 1, tr: 'none' };
  const big = (ch.tok.scale || 1) > 1.5;
  const D = ch.anim === 'pop' ? A.pop_dur * (big ? 1.25 : 1) : A.dur;
  const p = dt / D;
  if (p >= 1) return { o: 1, tr: 'none' };
  if (ch.anim === 'pop') {
    const over = big ? 1.28 : 1.12;
    const s = kf([[0, big ? 0.2 : 0.55], [0.45, over], [0.75, 0.96], [1, 1]], p);
    const r = big ? kf([[0, -14], [0.45, 4], [1, 0]], p) : 0;
    return { o: kf([[0, 0], [0.2, 1]], p), tr: `rotate(${r}deg) scale(${s})` };
  }
  const boost = ch.kind === 'accent' ? A.accent_boost : 1;
  const sy = kf([[0, A.from], [0.38, 1 + (A.overshoot - 1) * boost], [0.7, 0.96], [1, 1]], p);
  const sx = kf([[0, 1.12], [0.38, 0.92], [0.7, 1.02], [1, 1]], p);
  const sk = kf([[0, A.skew * boost], [0.38, A.skew * 0.6 * boost], [1, 0]], p);
  return { o: kf([[0, 0.7], [0.2, 1]], p), tr: `skewX(${sk}deg) scale(${sx}, ${sy})` };
}

function seek(t, layer) {
  const A = TL.style.anim;
  for (const B of BLOCKS) {
    // a block window (t0/t1: hook, CTA, dur/hold/tail) or its screen's
    const t0 = B.blk.t0 ?? B.screen.t0, t1 = B.blk.t1 ?? Math.min(B.screen.t1, B.blk.until ?? 1e9);
    const front = B.blk.behind === false;
    const on = t >= t0 && t < t1 && !(layer === 'back' && front) && !(layer === 'front' && !front);
    B.el.style.display = on ? 'block' : 'none';
    if (!on) continue;
    const fade = B.blk.fade ?? B.screen.fade ?? 0;
    B.el.style.opacity = fade ? Math.min(1, (t1 - t) / fade) : 1;
    if (B.count) { seekCount(B, t, t0, t1); continue; }
    for (const ch of B.chars) {
      const dt = t - ch.start;
      if (dt < 0) { ch.el.style.visibility = 'hidden'; continue; }
      ch.el.style.visibility = 'visible';
      const { o, tr } = charTransform(ch, dt, A);
      ch.el.style.opacity = o;
      ch.el.style.transform = tr;
    }
    if (B.lock) seekLockup(B, t, Math.min(...B.chars.map(c => c.start)), t1);
  }
  const svg = document.getElementById('doodles');
  if (svg) svg.style.display = layer === 'front' ? 'none' : '';
  seekDoodles(t);
  return true;
}

// ----------------------------------------------------------------------------- measure (layout and text checks)
function fontOf(st) {
  return `${st.italic ? 'italic ' : ''}${st.weight} ${st.size}px '${st.family}'`;
}

// Ink rectangles of a block's glyphs at rest (canvas actualBoundingBox, plus the stroke), relative to the block
// origin, and the pixels where letters of different lines overlap (both alphas >= 128). Serif labels are
// left out of the overlap count: canvas ignores their "lnum"/"case" features.
function inkChecks(B) {
  const cv = document.createElement('canvas'), ctx = cv.getContext('2d', { willReadFrequently: true });
  const sp = Math.min(4, (B.blk.stroke || {}).px || 0);
  const glyphs = B.chars.map(ch => {
    ctx.font = fontOf(ch.st);
    const m = ctx.measureText(ch.el.textContent);
    return { ch, x0: ch.left - m.actualBoundingBoxLeft - sp, x1: ch.left + m.actualBoundingBoxRight + sp,
             y0: ch.baselineY - m.actualBoundingBoxAscent - sp, y1: ch.baselineY + m.actualBoundingBoxDescent + sp };
  });
  if (!glyphs.length) return { ink: null, collisions: [] };
  const box = gs => ({ x0: Math.min(...gs.map(g => g.x0)), y0: Math.min(...gs.map(g => g.y0)),
                       x1: Math.max(...gs.map(g => g.x1)), y1: Math.max(...gs.map(g => g.y1)) });
  const all = box(glyphs);
  const lines = [...new Set(glyphs.map(g => g.ch.li))].map(li => {
    const gs = glyphs.filter(g => g.ch.li === li && g.ch.kind !== 'label');
    return { li, gs, r: gs.length ? box(gs) : null };
  });
  const collisions = [];
  const alpha = (gs, r, w, h) => {
    ctx.clearRect(0, 0, w, h);
    for (const g of gs) { ctx.font = fontOf(g.ch.st); ctx.fillText(g.ch.el.textContent, g.ch.left - r.x0, g.ch.baselineY - r.y0); }
    const d = ctx.getImageData(0, 0, w, h).data, a = new Uint8Array(w * h);
    for (let i = 0; i < w * h; i++) a[i] = d[4 * i + 3];
    return a;
  };
  for (let i = 0; i < lines.length; i++) {
    for (let j = i + 1; j < lines.length; j++) {
      const A = lines[i].r, C = lines[j].r;
      if (!A || !C) continue;
      const r = { x0: Math.floor(Math.max(A.x0, C.x0)), y0: Math.floor(Math.max(A.y0, C.y0)),
                  x1: Math.ceil(Math.min(A.x1, C.x1)), y1: Math.ceil(Math.min(A.y1, C.y1)) };
      const w = r.x1 - r.x0, h = r.y1 - r.y0;
      if (w <= 0 || h <= 0) continue;
      cv.width = w; cv.height = h;
      ctx.fillStyle = '#000';
      ctx.textBaseline = 'alphabetic';
      const a = alpha(lines[i].gs, r, w, h), b = alpha(lines[j].gs, r, w, h);
      let n = 0;
      for (let k = 0; k < a.length; k++) if (a[k] >= 128 && b[k] >= 128) n++;
      if (n) collisions.push([lines[i].li, lines[j].li, n]);
    }
  }
  return { ink: { x: all.x0, y: all.y0, w: all.x1 - all.x0, h: all.y1 - all.y0 }, collisions };
}

// The words of a block (one box per token, at rest, relative to the block origin) with their reveal time and
// colour; "fill" marks words drawn on their own capsule.
function wordsOf(B) {
  if (B.count) return [B.count.word];
  const byTok = new Map();
  for (const ch of B.chars) { if (!byTok.has(ch.tok)) byTok.set(ch.tok, []); byTok.get(ch.tok).push(ch); }
  return [...byTok.entries()].filter(([tok]) => tok.kind !== 'deco' && tok.kind !== 'label').map(([tok, cs]) => {
    const x0 = Math.min(...cs.map(c => c.left)), x1 = Math.max(...cs.map(c => c.left + c.w));
    const y0 = Math.min(...cs.map(c => c.baselineY - c.size * 0.74)), y1 = Math.max(...cs.map(c => c.baselineY + c.size * 0.22));
    return { x: x0, y: y0, w: x1 - x0, h: y1 - y0, t: Math.min(...cs.map(c => c.start)), text: tok.text,
             color: cs[0].st.color, fill: cs[0].fill };
  });
}

// Block sizes for the Python layout solver (blocks rendered at x=y=0 in measure mode), plus the text checks' data.
function measure() {
  return BLOCKS.map(B => ({ id: B.blk.id, bbox: B.bbox, x: B.blk.x || 0, y: B.blk.y || 0, words: wordsOf(B),
                            ...(B.count ? { ink: null, collisions: [] } : inkChecks(B)) }));
}

function debugBoxes() {
  for (const B of BLOCKS) {
    const d = document.createElement('div');
    d.className = 'debug';
    Object.assign(d.style, { left: B.bbox.x + 'px', top: B.bbox.y + 'px', width: B.bbox.w + 'px', height: B.bbox.h + 'px' });
    B.el.parentNode.appendChild(d);
  }
}
</script>
